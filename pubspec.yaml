name: app
description: "On-demand marketplace app for local services (customer and provider modes)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: ^1.0.9
  # Picking a PDF for verification. Photos come from image_picker, which
  # offers the camera as well.
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  image_picker: ^1.1.2
  intl: ^0.20.3
  material_ui: ^1.3.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates the translation classes from lib/l10n/*.arb (see l10n.yaml).
  generate: true
